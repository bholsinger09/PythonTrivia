<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Dashboard - Python Trivia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .metric-card h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3rem;
            border-bottom: 2px solid #667eea;
            padding-bottom: 8px;
        }

        .metric-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .metric-item:last-child {
            border-bottom: none;
        }

        .metric-label {
            font-weight: 500;
            color: #555;
        }

        .metric-value {
            font-weight: bold;
            color: #333;
        }

        .metric-value.good {
            color: #27ae60;
        }

        .metric-value.warning {
            color: #f39c12;
        }

        .metric-value.danger {
            color: #e74c3c;
        }

        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            margin: 50px 0;
        }

        .error {
            background: rgba(231, 76, 60, 0.9);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }

        .timestamp {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 20px;
            font-size: 0.9rem;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-healthy {
            background-color: #27ae60;
        }

        .status-warning {
            background-color: #f39c12;
        }

        .status-danger {
            background-color: #e74c3c;
        }

        @media (max-width: 768px) {
            .metrics-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2rem;
            }

            .metric-card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="dashboard">
        <div class="header">
            <h1>🚀 Performance Dashboard</h1>
            <p>Real-time monitoring for Python Trivia Game</p>
        </div>

        <div id="loading" class="loading">
            Loading performance metrics...
        </div>

        <div id="error-container"></div>

        <div id="metrics-container" class="metrics-grid" style="display: none;">
            <!-- Metrics will be populated by JavaScript -->
        </div>

        <div id="timestamp" class="timestamp"></div>
    </div>

    <button class="refresh-btn" onclick="loadMetrics()">
        🔄 Refresh
    </button>

    <script>
        let lastUpdateTime = null;

        async function loadMetrics() {
            const loadingEl = document.getElementById('loading');
            const errorContainer = document.getElementById('error-container');
            const metricsContainer = document.getElementById('metrics-container');
            const timestampEl = document.getElementById('timestamp');

            loadingEl.style.display = 'block';
            errorContainer.innerHTML = '';
            metricsContainer.style.display = 'none';

            try {
                const response = await fetch('/api/admin/performance-metrics');

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                displayMetrics(data);

                lastUpdateTime = new Date();
                timestampEl.textContent = `Last updated: ${lastUpdateTime.toLocaleString()}`;

                loadingEl.style.display = 'none';
                metricsContainer.style.display = 'grid';

            } catch (error) {
                console.error('Error loading metrics:', error);
                loadingEl.style.display = 'none';
                errorContainer.innerHTML = `
                    <div class="error">
                        <strong>Error loading performance metrics:</strong><br>
                        ${error.message}<br>
                        <small>Make sure the application is running in debug mode</small>
                    </div>
                `;
            }
        }

        function displayMetrics(data) {
            const container = document.getElementById('metrics-container');
            container.innerHTML = '';

            // Cache Performance
            if (data.cache_performance) {
                container.appendChild(createCacheCard(data.cache_performance));
            }

            // Request Performance
            if (data.request_performance) {
                container.appendChild(createRequestCard(data.request_performance));
            }

            // Database Performance
            if (data.database_performance) {
                container.appendChild(createDatabaseCard(data.database_performance));
            }

            // Rate Limiting
            if (data.rate_limit_stats) {
                container.appendChild(createRateLimitCard(data.rate_limit_stats));
            }

            // Errors
            if (data.error_summary) {
                container.appendChild(createErrorCard(data.error_summary));
            }

            // Health Status
            container.appendChild(createHealthCard(data));
        }

        function createCacheCard(cacheData) {
            const card = document.createElement('div');
            card.className = 'metric-card';

            let content = '<h3>💾 Cache Performance</h3>';

            for (const [cacheType, stats] of Object.entries(cacheData)) {
                const hitRatio = stats.hit_ratio_percent || 0;
                const statusClass = hitRatio > 80 ? 'good' : hitRatio > 50 ? 'warning' : 'danger';

                content += `
                    <div class="metric-item">
                        <span class="metric-label">${cacheType} Hit Ratio</span>
                        <span class="metric-value ${statusClass}">${hitRatio}%</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-label">${cacheType} Total Requests</span>
                        <span class="metric-value">${stats.total_requests || 0}</span>
                    </div>
                `;
            }

            card.innerHTML = content;
            return card;
        }

        function createRequestCard(requestData) {
            const card = document.createElement('div');
            card.className = 'metric-card';

            let content = '<h3>🌐 Request Performance</h3>';

            for (const [endpoint, stats] of Object.entries(requestData)) {
                const avgTime = stats.avg_response_time || 0;
                const statusClass = avgTime < 0.5 ? 'good' : avgTime < 1.0 ? 'warning' : 'danger';

                content += `
                    <div class="metric-item">
                        <span class="metric-label">${endpoint}</span>
                        <span class="metric-value ${statusClass}">${avgTime}s avg</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-label">Requests/min</span>
                        <span class="metric-value">${stats.requests_per_minute || 0}</span>
                    </div>
                `;
            }

            card.innerHTML = content;
            return card;
        }

        function createDatabaseCard(dbData) {
            const card = document.createElement('div');
            card.className = 'metric-card';

            let content = '<h3>🗄️ Database Performance</h3>';

            if (dbData.message) {
                content += `<div class="metric-item"><span class="metric-label">${dbData.message}</span></div>`;
            } else {
                const avgTime = dbData.avg_query_time || 0;
                const statusClass = avgTime < 0.1 ? 'good' : avgTime < 0.5 ? 'warning' : 'danger';

                content += `
                    <div class="metric-item">
                        <span class="metric-label">Avg Query Time</span>
                        <span class="metric-value ${statusClass}">${avgTime}s</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-label">Total Queries</span>
                        <span class="metric-value">${dbData.total_queries || 0}</span>
                    </div>
                    <div class="metric-item">
                        <span class="metric-label">Slow Queries</span>
                        <span class="metric-value ${dbData.slow_queries_count > 0 ? 'warning' : 'good'}">${dbData.slow_queries_count || 0}</span>
                    </div>
                `;
            }

            card.innerHTML = content;
            return card;
        }

        function createRateLimitCard(rateLimitData) {
            const card = document.createElement('div');
            card.className = 'metric-card';

            let content = '<h3>🛡️ Rate Limiting</h3>';

            for (const [endpoint, stats] of Object.entries(rateLimitData)) {
                const blockRate = stats.block_rate_percent || 0;
                const statusClass = blockRate < 5 ? 'good' : blockRate < 20 ? 'warning' : 'danger';

                content += `
                    <div class="metric-item">
                        <span class="metric-label">${endpoint}</span>
                        <span class="metric-value ${statusClass}">${blockRate}% blocked</span>
                    </div>
                `;
            }

            card.innerHTML = content;
            return card;
        }

        function createErrorCard(errorData) {
            const card = document.createElement('div');
            card.className = 'metric-card';

            let content = '<h3>⚠️ Error Summary</h3>';

            if (Object.keys(errorData).length === 0) {
                content += '<div class="metric-item"><span class="metric-label">No errors recorded</span><span class="metric-value good">✓</span></div>';
            } else {
                for (const [errorType, count] of Object.entries(errorData)) {
                    const statusClass = count > 10 ? 'danger' : count > 5 ? 'warning' : 'good';
                    content += `
                        <div class="metric-item">
                            <span class="metric-label">${errorType}</span>
                            <span class="metric-value ${statusClass}">${count}</span>
                        </div>
                    `;
                }
            }

            card.innerHTML = content;
            return card;
        }

        function createHealthCard(data) {
            const card = document.createElement('div');
            card.className = 'metric-card';

            // Determine overall health
            let healthStatus = 'healthy';
            let healthColor = 'status-healthy';

            // Check for any concerning metrics
            const cacheHitRates = Object.values(data.cache_performance || {}).map(c => c.hit_ratio_percent || 0);
            const requestTimes = Object.values(data.request_performance || {}).map(r => r.avg_response_time || 0);
            const errorCount = Object.values(data.error_summary || {}).reduce((a, b) => a + b, 0);

            if (errorCount > 20 || requestTimes.some(t => t > 2.0)) {
                healthStatus = 'unhealthy';
                healthColor = 'status-danger';
            } else if (errorCount > 5 || requestTimes.some(t => t > 1.0) || cacheHitRates.some(r => r < 50)) {
                healthStatus = 'degraded';
                healthColor = 'status-warning';
            }

            const content = `
                <h3>🏥 System Health</h3>
                <div class="metric-item">
                    <span class="metric-label">Overall Status</span>
                    <span class="metric-value">
                        <span class="status-indicator ${healthColor}"></span>
                        ${healthStatus.charAt(0).toUpperCase() + healthStatus.slice(1)}
                    </span>
                </div>
                <div class="metric-item">
                    <span class="metric-label">Last Updated</span>
                    <span class="metric-value">${new Date(data.timestamp).toLocaleTimeString()}</span>
                </div>
            `;

            card.innerHTML = content;
            return card;
        }

        // Auto-refresh every 30 seconds
        setInterval(loadMetrics, 30000);

        // Load initial metrics
        loadMetrics();
    </script>
</body>

</html>
